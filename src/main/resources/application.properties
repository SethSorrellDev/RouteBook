spring.application.name=RouteBook

# H2 in-memory database for local dev (mirrors AssistantScheduler/RouteOptimizer's SQLite-for-dev pattern)
spring.datasource.url=jdbc:h2:mem:routebook;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console - visit http://localhost:8080/h2-console after boot
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate: create-drop is fine for now since this is in-memory dev data,
# recreated fresh on every restart. Will move to Flyway/proper migrations
# once schema stabilizes past Phase 1.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Silence the open-in-view warning we saw on boot; explicit is better than implicit
spring.jpa.open-in-view=false

# --- Cloudflare R2 (Phase 4) ---
# All four values MUST be set as environment variables before running the
# app - never hardcoded here, since this file is headed for a public repo.
# export R2_ACCESS_KEY_ID=...
# export R2_SECRET_ACCESS_KEY=...
# export R2_BUCKET_NAME=...
# export R2_ENDPOINT=https://<ACCOUNT_ID>.r2.cloudflarestorage.com
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME}
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.presigned-url-expiry-minutes=15

# Multipart upload limits - matches the 250MB video ceiling; per-content-type
# limits (25MB for photos/docs) are enforced in AttachmentService, not here.
spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=250MB
