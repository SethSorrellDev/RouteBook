# Activated via SPRING_PROFILES_ACTIVE=prod on Render.
# Overrides the H2 dev settings from application.properties with a real
# Postgres connection. Set these three as environment variables on Render,
# not in this file - the values themselves are never committed.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# update (not create-drop) - the schema is created once and then altered
# in place on restarts, so real data in the production database survives
# app redeploys instead of being wiped every time.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# The H2 console has no purpose (and is a security risk) once Postgres is live.
spring.h2.console.enabled=false

# Render assigns a dynamic port via the PORT env var - fall back to 8080
# for any other environment that activates this profile without setting it.
server.port=${PORT:8080}
