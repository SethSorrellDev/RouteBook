# Test-only config - Spring Boot automatically prefers this over
# src/main/resources/application.properties when running tests, so the
# test suite never needs real (or even placeholder) R2 env vars set.
spring.datasource.url=jdbc:h2:mem:routebook-test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

cloudflare.r2.access-key-id=test-key
cloudflare.r2.secret-access-key=test-secret
cloudflare.r2.bucket-name=test-bucket
cloudflare.r2.endpoint=https://test.r2.cloudflarestorage.com
cloudflare.r2.presigned-url-expiry-minutes=15

app.cors.allowed-origins=http://localhost:5173

app.cors.allowed-origins=http://localhost:5173
